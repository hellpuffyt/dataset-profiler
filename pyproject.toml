[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-profiler"
version = "0.1.0"
description = "Profile a tabular dataset — inferred types, cardinality, null patterns — and measure distribution drift against a stored baseline."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Prabesh Sharma" }]
keywords = ["data-quality", "profiling", "drift", "csv", "cli", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
dataset-profiler = "dataset_profiler.cli:main"

[project.urls]
Homepage = "https://github.com/hellpuffyt/dataset-profiler"
Issues = "https://github.com/hellpuffyt/dataset-profiler/issues"
Changelog = "https://github.com/hellpuffyt/dataset-profiler/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_profiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
